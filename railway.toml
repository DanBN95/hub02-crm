# Railway config — NestJS API service
# Set "Root Directory" to "/" in the Railway service settings (not apps/api).
# nixpacks.toml in this directory handles install/build/start phases.

[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
